<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <link rel="stylesheet" href="styles/practice.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <section class="banner hidden">
        <div class="banner-container">
            <div class="banner-image">
                <img class="hero-circle" src="./assets/hero-circle.png" alt="">
                <img class="mic" src="./assets/microphone.png" alt="">
            </div>
            <div class="banner-content">
                <h1 class="banner-title">TechWave</h1>
                <p class="banner-description">Your daily dose of tech insights, productivity hacks, and personal growth
                </p>
                <button class="bg-linear"><i class="fa-brands fa-spotify"></i> Listen on Spotify</button>
                <button class="msg"><i class="fa-regular fa-envelope"></i> Subscribe</button>
            </div>
        </div>
    </section>
    <section class="footer">
        <div class="footer-container">
            <h2 class="logo">Tech<span class="footer-linear">Wave</span></h2>
            <div class="social-icons">
                <li><img src="./assets/spotify.png" alt="">Spotify</li>
                <li><img src="./assets/apple-podcast.png" alt="">Apple Podcasts</li>
                <li><img src="./assets/youtube-podcast.png" alt="">YouTube</li>
                <li><img src="./assets/twitter.png" alt="">Twitter</li>
            </div>
            <div class="copyright">© 2026 TechWave Podcast. All rights reserved.</div>
        </div>
    </section>
</body>

</html>
